<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}?v={{ version }}">
</head>
<body class="page-{{ page }}">
  <div id="conn-banner" class="conn-banner" role="alert" hidden>
    ⚠ Ingen forbindelse til talerstolen – forsøger igen …
  </div>
  {% block body %}{% endblock %}
  <div id="toasts" class="toasts" aria-live="assertive"></div>
  <script src="{{ url_for('static', path='js/common.js') }}?v={{ version }}"></script>
  <script src="{{ url_for('static', path='js/scene-render.js') }}?v={{ version }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
